name: CI

# Manual trigger only, for now.
#
# GitHub Actions is currently unavailable on this account ("the job was not
# started because your account is locked due to a billing issue"), so every
# automatic run is cancelled before a runner is assigned. Those cancellations
# are not test failures -- they say nothing about the code -- but they would
# mark every commit with a red cross, which is worse than no signal at all.
#
# To restore automatic runs once Actions is available again, delete this
# comment and uncomment the two triggers below:
#
#   push:
#     branches: [main]
#   pull_request:
#
# Until then, run the same checks locally -- see "Development" in the README.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=impactlens --cov-report=term-missing

  validate:
    name: statistical validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The recovery study is the claim the README makes, so CI re-checks it.
      # A change that narrows the intervals would pass every unit test and still
      # make the tool overconfident -- this is the job that catches that.
      - name: Recovery study
        run: impactlens validate -n 60 --csv-out validation.csv

      - name: Assert the estimators are still calibrated
        run: python scripts/assert_calibration.py validation.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-summary
          path: validation.csv

  smoke:
    name: cli and dashboard smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"

      - name: CLI demo end to end
        run: impactlens demo --outdir outputs

      - name: A report was actually produced
        run: test -s outputs/impact_report.pdf

      - name: Analyse the packaged example
        run: |
          impactlens analyse examples/clinic_appointments.csv \
            --treated flagship_clinic \
            --date 2025-06-30 \
            --outcome-name "weekly appointments" \
            --csv-out outputs/results.csv

      - name: Dashboard parses and imports cleanly
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('src/impactlens/app/streamlit_app.py').read_text(encoding='utf-8'))"
          python -c "import impactlens; print(impactlens.__version__)"
